name: Build Respiro premium-unlock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android build-tools (zipalign, apksigner)
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if ! ls "$SDK"/build-tools/*/zipalign >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          fi
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "bt=$BT" >> "$GITHUB_OUTPUT"
          "$BT/zipalign" --version || true
          "$BT/apksigner" --version

      - name: Extract classes.dex and apply equal-length patches
        run: |
          mkdir -p work
          python3 - <<'PY'
          import zipfile
          zipfile.ZipFile('base-original.apk').extract('classes.dex', 'work')
          print('extracted classes.dex')
          PY
          python3 patch/dex_patch_bytes.py work/classes.dex \
            --spec patch/patch_spec.json \
            -o work/classes-final.dex \
            --report work/patch-report.json
          echo "patched dex sha256:"; sha256sum work/classes-final.dex

      - name: Repack APK (swap classes.dex, drop old signature entries)
        run: |
          python3 patch/repack_simple.py base-original.apk work/classes-final.dex work/repacked.apk
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('work/repacked.apk')
          names = [i.filename for i in z.infolist()]
          print('entries:', len(names))
          assert len(names) == len(set(names)), 'duplicate zip entries!'
          assert 'META-INF/ANDROIDD.RSA' not in names and 'META-INF/MANIFEST.MF' not in names
          i = z.getinfo('classes.dex')
          print('classes.dex method=%d size=%d' % (i.compress_type, i.file_size))
          print('resources.arsc method=%d (0=STORED)' % z.getinfo('resources.arsc').compress_type)
          PY

      - name: Rebrand (package id + visible app name in binary manifest)
        run: |
          python3 patch/rebrand_axml.py work/repacked.apk work/rebranded.apk \
            --package org.moss.app --label Moss
          echo "== manifest after rebrand =="
          python3 patch/rebrand_axml.py work/rebranded.apk --dump

      - name: zipalign
        run: |
          BT="${{ steps.sdk.outputs.bt }}"
          "$BT/zipalign" -p -f 4 work/rebranded.apk work/aligned.apk
          "$BT/zipalign" -c -p 4 work/aligned.apk && echo "alignment OK"

      - name: Sign (v1+v2+v3)
        run: |
          BT="${{ steps.sdk.outputs.bt }}"
          "$BT/apksigner" sign \
            --ks keystore/respiro.keystore \
            --ks-pass pass:respiro123 \
            --key-pass pass:respiro123 \
            --ks-key-alias respiro \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out moss-test-no-publish.apk work/aligned.apk
          "$BT/apksigner" verify --print-certs --verbose \
            --min-sdk-version 21 --max-sdk-version 36 moss-test-no-publish.apk
          echo "apk sha256:"; sha256sum moss-test-no-publish.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moss-test-no-publish-apk
          path: |
            moss-test-no-publish.apk
            work/patch-report.json
          if-no-files-found: error
